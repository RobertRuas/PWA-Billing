<!-- Subject: Billing · Reset your password -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:32px 16px}
.card{background:#fff;border-radius:12px;padding:32px 24px;text-align:center}
h1{font-size:22px;font-weight:700;margin:0 0 8px;color:#1c1c1e}
p{font-size:14px;line-height:1.6;color:#8e8e93;margin:0 0 24px}
.btn{display:inline-block;background:#007aff;color:#fff;font-size:16px;font-weight:600;text-decoration:none;padding:12px 32px;border-radius:10px}
.footer{font-size:12px;color:#aeaeb2;text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1>Billing</h1>
  <p>We received a request to reset your account password. Click the button below to create a new password.</p>
  <a href="{ACTION_URL}" class="btn">Reset password</a>
</div>
<p class="footer">If you did not request this, you can ignore this email. Your password will not be changed.</p>
</div>
</body>
</html>
